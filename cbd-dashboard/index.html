<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아파트 밀도 CBD 탐색기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="landing">

<!-- ===================== 표지 ===================== -->
<section id="landing">
  <header class="land-top">
    <a class="mark" href="#" data-home aria-label="CBD Finder">
      <svg viewBox="0 0 40 40" aria-hidden="true" fill="none">
        <path d="M20 3.5 33.3 11v18L20 36.5 6.7 29V11z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M20 13.2 26.8 17v8L20 28.8 13.2 25v-8z" fill="currentColor"/>
      </svg>
      <span>CBD Finder</span>
    </a>
    <nav class="land-nav">
      <div class="nav-links">
        <button type="button" class="txt-link" data-about aria-expanded="false" data-i18n="nav.about">About</button>
        <a class="txt-link" href="https://greensmartcity.smu.ac.kr/greensmartcity/index.do" target="_blank" rel="noopener noreferrer" data-i18n="nav.contact">Contact</a>
      </div>
      <div class="land-ctrls">
        <div class="lang" role="group" data-i18n-attr="aria-label:lang.group">
          <button type="button" data-lang="ko">한국어</button>
          <button type="button" data-lang="en">English</button>
        </div>
        <button type="button" class="icon-btn theme-btn" data-theme-toggle><span class="theme-icon" aria-hidden="true">☾</span></button>
      </div>
    </nav>
  </header>

  <main class="land-main">
    <p class="land-eyebrow" data-i18n="land.eyebrow"></p>
    <h1 class="hl" id="hlBox">
      <span class="hl-line"></span><span class="hl-line"></span><span class="hl-line"></span>
      <span class="hero-art" id="heroArt" aria-hidden="true"><span class="art-in"></span></span>
    </h1>
    <div class="land-below">
      <p class="land-sub" data-i18n="land.sub"></p>
      <button type="button" class="cta" id="startBtn">
        <span data-i18n="land.cta"></span>
        <span class="arr" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none"><path d="M4 10h11m-4.5-4.5L15 10l-4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>
  </main>

  <footer class="land-foot">
    <span data-i18n="land.footL"></span>
    <span data-i18n="land.footR"></span>
  </footer>
</section>

<!-- ===================== 분석 화면 ===================== -->
<div id="app">
  <header class="top">
    <button class="brand" type="button" data-home data-i18n-attr="title:nav.home">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M20 3.5 33.3 11v18L20 36.5 6.7 29V11z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M20 13.2 26.8 17v8L20 28.8 13.2 25v-8z" fill="currentColor"/>
        </svg>
      </span>
      <span>
        <h1 data-i18n="app.title"></h1>
        <p data-i18n="app.subtitle"></p>
      </span>
    </button>
    <div class="top-right">
      <div class="nav-links">
        <button type="button" class="txt-link" data-about aria-expanded="false" data-i18n="nav.about">About</button>
        <a class="txt-link" href="https://greensmartcity.smu.ac.kr/greensmartcity/index.do" target="_blank" rel="noopener noreferrer" data-i18n="nav.contact">Contact</a>
      </div>
      <div class="top-actions">
        <div class="lang" role="group" data-i18n-attr="aria-label:lang.group">
          <button type="button" data-lang="ko">한국어</button>
          <button type="button" data-lang="en">English</button>
        </div>
        <button id="themeBtn" class="btn ghost theme-btn" type="button" data-theme-toggle>
          <span class="theme-icon" aria-hidden="true">☾</span> <span class="txt theme-txt"></span>
        </button>
        <button id="settingsBtn" class="btn" type="button">⚙ <span class="txt" data-i18n="sgis.btn"></span> <span id="sgisBadge" class="badge"></span></button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <div id="map" data-i18n-attr="aria-label:map.aria"></div>

      <div class="mapbar">
        <form id="searchForm" class="search" role="search">
          <input id="q" type="search" autocomplete="off" data-i18n-attr="placeholder:search.placeholder;aria-label:search.aria">
          <button id="goBtn" type="submit" class="btn primary" data-i18n="search.btn"></button>
        </form>
        <div class="modes" role="group" data-i18n-attr="aria-label:modes.aria">
          <button type="button" class="mode" id="pickBtn" aria-pressed="false" data-i18n="pick.btn"></button>
          <select id="pickLevel" data-i18n-attr="aria-label:pick.levelAria">
            <option value="sgg" selected data-i18n="level.sgg"></option>
            <option value="dong" data-i18n="level.dong"></option>
            <option value="sido" data-i18n="level.sido"></option>
          </select>
          <button type="button" class="mode" id="drawBtn" aria-pressed="false" data-i18n="draw.btn"></button>
        </div>
        <div class="hint" id="mapHint" hidden></div>
        <div class="results" id="results" hidden></div>
      </div>

      <div id="busyPill" class="busy-pill" hidden><span class="spin"></span><span id="busyTxt"></span></div>
      <div id="mapEmpty" class="map-empty">
        <div class="box">
          <h2 data-i18n="empty.title"></h2>
          <p data-i18n-html="empty.body"></p>
          <div class="chips" id="examples"></div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card steps"><ol id="steps"></ol></div>

      <div class="card hero placeholder" id="hero"></div>

      <div class="tiles" id="tiles"></div>

      <div class="card" id="bldCard">
        <div class="card-head">
          <div>
            <h3 data-i18n="bld.title"></h3>
            <p class="sub" id="bldSub" data-i18n="bld.subDefault"></p>
          </div>
          <select id="bldRadius" data-i18n-attr="aria-label:bld.radiusAria"></select>
        </div>
        <div id="bldChart"></div>
        <details><summary data-i18n="bld.rules"></summary><div class="rules" id="bldRules"></div></details>
      </div>

      <div class="card">
        <h3 data-i18n="ctl.title"></h3>
        <p class="sub" data-i18n="ctl.sub"></p>
        <div class="ctl">
          <label for="thr" class="help-t" data-help="thr"><span data-i18n="ctl.thr"></span><span class="qi" tabindex="0" role="button" data-help-aria="thr">?</span></label>
          <input id="thr" type="range" min="1.2" max="6" step="0.1" value="2">
          <output id="thrOut">×2.0</output>

          <label for="cell" class="help-t" data-help="cell"><span data-i18n="ctl.cell"></span><span class="qi" tabindex="0" role="button" data-help-aria="cell">?</span></label>
          <select id="cell">
            <option value="0" selected data-i18n="cell.auto"></option>
            <option value="0.15">150 m</option>
            <option value="0.25">250 m</option>
            <option value="0.5">500 m</option>
            <option value="1">1 km</option>
            <option value="2">2 km</option>
          </select>

          <label for="smooth" class="help-t" data-help="smooth"><span data-i18n="ctl.smooth"></span><span class="qi" tabindex="0" role="button" data-help-aria="smooth">?</span></label>
          <select id="smooth">
            <option value="0" data-i18n="smooth.0"></option>
            <option value="0.75" data-i18n="smooth.075"></option>
            <option value="1.25" selected data-i18n="smooth.125"></option>
            <option value="2" data-i18n="smooth.2"></option>
          </select>

          <label class="help-t" data-help="mode"><span data-i18n="ctl.mode"></span><span class="qi" tabindex="0" role="button" data-help-aria="mode">?</span></label>
          <div class="seg" role="radiogroup" data-i18n-attr="aria-label:ctl.mode">
            <label><input type="radio" name="mode" value="count" checked><span data-i18n="mode.count"></span></label>
            <label><input type="radio" name="mode" value="floor"><span data-i18n="mode.floor"></span></label>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="hist.title"></h3>
        <p class="sub" data-i18n="hist.sub"></p>
        <div id="histChart"></div>
      </div>

      <div class="card">
        <h3 data-i18n="cluster.title"></h3>
        <p class="sub" data-i18n="cluster.sub"></p>
        <div id="clusterChart"></div>
      </div>

      <div class="card">
        <h3 data-i18n="dong.title"></h3>
        <p class="sub" id="dongSub" data-i18n="dong.subDefault"></p>
        <div id="dongChart"></div>
        <details id="dongDetails" hidden><summary data-i18n="dong.table"></summary><div class="tbl-wrap" id="dongTable"></div></details>
      </div>

      <div class="card method">
        <details>
          <summary data-i18n="method.summary"></summary>
          <div data-i18n-html="method.body"></div>
        </details>
      </div>
    </aside>
  </main>
</div>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <h2 data-i18n="dlg.title"></h2>
    <p class="hint-txt" data-i18n="dlg.hint"></p>
    <label><span data-i18n="dlg.key"></span><input name="sgisKey" autocomplete="off" spellcheck="false"></label>
    <label><span data-i18n="dlg.secret"></span><input name="sgisSecret" type="password" autocomplete="off" spellcheck="false"></label>
    <div class="row2">
      <label><span data-i18n="dlg.year"></span><select name="year"></select></label>
      <label><span data-i18n="dlg.aptType"></span><input name="aptType" spellcheck="false"></label>
    </div>
    <div class="row2">
      <label><span data-i18n="dlg.floors"></span><input name="floors" type="number" min="1" max="80"></label>
      <label><span data-i18n="dlg.overpass"></span><select name="overpass">
        <option value="https://maps.mail.ru/osm/tools/overpass/api/interpreter" data-i18n="dlg.recommended"></option>
        <option value="https://overpass-api.de/api/interpreter">overpass-api.de</option>
      </select></label>
    </div>
    <p id="sgisTestMsg"></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="clearKeys" data-i18n="dlg.clear"></button>
      <button type="button" class="btn" id="testSgis" data-i18n="dlg.test"></button>
      <button value="cancel" class="btn" data-i18n="dlg.cancel"></button>
      <button value="save" class="btn primary" data-i18n="dlg.save"></button>
    </div>
  </form>
</dialog>

<div id="tip" class="tip" hidden></div>
<div id="helpPop" class="help-pop" role="tooltip" hidden></div>
<div id="aboutPop" class="about-pop" role="dialog" aria-modal="false" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
